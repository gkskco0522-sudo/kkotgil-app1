name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml', 'assets/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install
      - name: Add Android project
        run: npx cap add android
      - name: App icon
        run: cp -r assets/android-res/. android/app/src/main/res/
      - name: Sync web files
        run: npx cap sync android
      - name: Add alarm sounds
        run: |
          mkdir -p android/app/src/main/res/raw
          cp docs/sounds/*.wav android/app/src/main/res/raw/
          ls android/app/src/main/res/raw
      - name: Allow exact alarms
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "EXACT_ALARM" android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kkotgil-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
